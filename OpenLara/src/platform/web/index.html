<html lang="en">
		<head>
			<title>OpenLara — P2P Asset Streaming Demo</title>
			<link href="favicon.ico" rel="shortcut icon" type="image/x-icon" />
			<style>
			html {
				overflow: auto;
			}
			body {
				margin: 0px;
				font-size: 1.0em;
				touch-action: none;
			}
			.game_fs {
				position: fixed;
				top: 0px;
				left: 0px;
				margin: 0px;
				width: 100%;
				height: 100%;
				border: 0;
				display: block;
			}
			table {
				border-collapse: collapse;
			}

				border: 1px solid black;
				padding: 4px;
			}
			</style>
			<meta charset="utf-8">
			<meta name="mobile-web-app-capable" content="yes">
			<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
			<meta name="viewport" content="viewport-fit=cover, user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
			<!--<meta name="viewport" content="width=854, user-scalable=no">-->

		<body>
			<button id="goFS">Go fullscreen</button>
			<canvas class="game" id="canvas" width="854" height="480" oncontextmenu="event.preventDefault()"></canvas><br>
			<div id="status">Starting...</div>
			<script>
				indexedDB.deleteDatabase('OpenLara');
				var statusElement = document.getElementById('status');
				var canvasElement = document.getElementById('canvas');
				var proc;

				function fullscreen(container) {
					Module.ccall('change_fs_mode', 'null', [], []);
					canvasElement.focus();
				}

				var goFS = document.getElementById("goFS");
				document.getElementById("goFS").style.display = 'block';
				goFS.addEventListener("click", function() { fullscreen(canvasElement); }, false);

				window.onload = function() { window.focus(); }
				
				var Module = {
					TOTAL_MEMORY: 192*1024*1024,
					preRun: [],
					postRun: [],
					print: (function() {
								return function(text) {
									if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
									console.log(text);
								};
							})(),
					printErr: function(text) {
						if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
						if (0) {
							dump(text + '\n');
						} else {
							console.error(text);
						}
					},
					canvas: (function() {
						canvasElement.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);
						return canvasElement;
					})(),
					setStatus: function(text) {
						if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
						if (text === Module.setStatus.text) return;
						statusElement.innerHTML = text;
					},
					totalDependencies: 0,
					monitorRunDependencies: function(left) {
						this.totalDependencies = Math.max(this.totalDependencies, left);
						Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
					},
				};

				var audioContext = null;

				function snd_init() {
					var AudioContext = window.AudioContext || window.webkitAudioContext;
					if (!AudioContext) return;
					audioContext = new (window.AudioContext || window.webkitAudioContext)();
					var count  = 4096;
					var rate   = 44100 / audioContext.sampleRate;
					var framesCount = Math.ceil(count * rate);
					var frames = Module._malloc(framesCount * 4); // interleaved short L, R
					proc = audioContext.createScriptProcessor(count, 2, 2);
					proc.onaudioprocess = function(e) {
						var L = e.outputBuffer.getChannelData(0),
							R = e.outputBuffer.getChannelData(1);
						Module.ccall('snd_fill', 'null', ['number', 'number'], [frames, framesCount]);
						for (var i = 0; i < count; i++) {
							var index = frames + Math.floor(i * rate) * 4; // 4 is sample frame stride in bytes
							L[i] = Module.getValue(index    , 'i16') / 0x8000;
							R[i] = Module.getValue(index + 2, 'i16') / 0x8000;
						}
					}
					proc.connect(audioContext.destination);
				}

				function getLanguage() {
					var lang = navigator.languages && navigator.languages[0] || navigator.language || navigator.userLanguage;
					if (!lang) return;
					var id = 0;
					lang = lang.substring(0, 2);
					if (lang == "fr") {
						id = 1;
					} else if (lang == "de") {
						id = 2;
					} else if (lang == "es") {
						id = 3;
					} else if (lang == "it") {
						id = 4;
					} else if (lang == "pl") {
						id = 5;
					} else if (lang == "pt") {
						id = 6;
					} else if (lang == "ru" || lang == "be" || lang == "uk") {
						id = 7;
					} else if (lang == "ja") {
						id = 8;
					} else if (lang == "gr") {
						id = 9;
					} else if (lang == "fi") {
                        id = 10;
                    } else if (lang == "cs") {
                        id = 11;
                    } else if (lang == "zh") {
                        id = 12;
                    } else if (lang == "hu") {
                        id = 13;
                    } else if (lang == "sv") {
                        id = 14;
                    }
					Module.ccall('set_def_lang', 'null', ['number'], [id]);
				}

			// unlock audio context after user interaction
				var userAction = function() {
					if (audioContext && audioContext.state == "suspended") {
						audioContext.resume().then(function() {
							window.removeEventListener('touchstart', userAction, false);
							window.removeEventListener('click', userAction, false);
							console.log("resume playback");
						});
					}
				};
				window.addEventListener('touchstart', userAction, false);
				window.addEventListener('click', userAction, false);

				Module.setStatus('Downloading...');
				window.onerror = function(event) {
					Module.setStatus('Exception thrown, see JavaScript console');
					//spinnerElement.style.display = 'none';
					document.getElementById('info').innerHTML = event;
					Module.setStatus = function(text) {
						if (text) Module.printErr('[post-exception status] ' + text);
					};
				};
			</script>

			<div id="level-selector" style="position:fixed; bottom:20px; left:20px; z-index:9999; background: rgba(15, 15, 20, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 15px; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; box-shadow: 0 8px 32px rgba(0,0,0,0.3);">
				<div style="font-weight: 600; font-size: 14px; margin-bottom: 10px; color: rgba(255,255,255,0.9); display: flex; align-items: center; gap: 8px;">
					<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg>
					Level Selection
				</div>
				<div style="display: flex; gap: 10px; align-items: center;">
					<select id="levelSelect" style="background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; cursor: pointer; min-width: 220px; font-family: inherit;">
						<option value="Tomb-Raider-1/01-Caves.PHD">01 - Caves</option>
						<option value="Tomb-Raider-1/02-City-of-Vilcabamba.PHD">02 - City of Vilcabamba</option>
						<option value="Tomb-Raider-1/03-The-Lost-Valley.PHD">03 - The Lost Valley</option>
						<option value="Tomb-Raider-1/04-Tomb-of-Qualopec.PHD">04 - Tomb of Qualopec</option>
						<option value="Tomb-Raider-1/05-St-Francis-Folly.PHD">05 - St Francis Folly</option>
						<option value="Tomb-Raider-1/06-Colosseum.PHD">06 - Colosseum</option>
						<option value="Tomb-Raider-1/07-Palace-Midas.PHD">07 - Palace Midas</option>
						<option value="Tomb-Raider-1/08-Cistern.PHD">08 - Cistern</option>
						<option value="Tomb-Raider-1/09-Tomb-of-Tihocan.PHD">09 - Tomb of Tihocan</option>
						<option value="Tomb-Raider-1/10-City-of-Khamoon.PHD">10 - City of Khamoon</option>
						<option value="Tomb-Raider-1/11-Obelisk-of-Khamoon.PHD">11 - Obelisk of Khamoon</option>
						<option value="Tomb-Raider-1/12-Sanctuary-of-the-Scion.PHD">12 - Sanctuary of the Scion</option>
						<option value="Tomb-Raider-1/13-Natlas-Mines.PHD">13 - Natlas Mines</option>
						<option value="Tomb-Raider-1/14-Atlantis.PHD">14 - Atlantis</option>
						<option value="Tomb-Raider-1/15-The-Great-Pyramid.PHD">15 - The Great Pyramid</option>
					</select>
					<button onclick="loadSelectedLevel()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.2s; font-family: inherit;" onmouseover="this.style.background='rgba(255,255,255,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'">Load</button>
					<button onclick="jumpNextLevel()" style="background: rgba(74, 144, 226, 0.3); border: 1px solid rgba(74, 144, 226, 0.5); color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.2s; font-family: inherit;" onmouseover="this.style.background='rgba(74, 144, 226, 0.5)'" onmouseout="this.style.background='rgba(74, 144, 226, 0.3)'">Next Level ⏭</button>
				</div>
			</div>

			<!-- P2P Asset Streaming Layer - loaded BEFORE WASM engine -->
			<script src="p2p/AssetCache.js"></script>
			<script src="p2p/P2PManager.js"></script>
			<script src="p2p/P2POverlay.js"></script>
			<script src="p2p/p2p-bootstrap.js"></script>

			<script>
				var script = document.createElement('script');

				if ('WebAssembly' in window) {
					console.log("Start WebAssembly!");
					script.src = "OpenLara_wasm.js";
				} else {
					console.log("Start asm.js!");
					script.src = "OpenLara.js";
					(function() {
						var memoryInitializer = 'OpenLara.js.mem';
						if (typeof Module['locateFile'] === 'function') {
							memoryInitializer = Module['locateFile'](memoryInitializer);
						} else if (Module['memoryInitializerPrefixURL']) {
							memoryInitializer = Module['memoryInitializerPrefixURL'] + memoryInitializer;
						}
						var xhr = Module['memoryInitializerRequest'] = new XMLHttpRequest();
						xhr.open('GET', memoryInitializer, true);
						xhr.responseType = 'arraybuffer';
						xhr.send(null);
					})();
				}

				document.body.appendChild(script);

				//window.onbeforeunload = function () { // Ctrl+W
				//	return "Really want to quit the game?";
				//};

				var isMobile = !!navigator.platform && (/iPad|iPhone|iPod/.test(navigator.platform) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));

				if (isMobile) {
					canvasElement.className = "game_fs";
					statusElement.style.display = 'none';
					document.getElementById('info').style.display = 'none';
				}

				async function loadSelectedLevel() {
					const select = document.getElementById('levelSelect');
					const levelPath = select.value;
					loadLevelFromUrl(`/levels/${levelPath}`);
				}

				function jumpNextLevel() {
					const select = document.getElementById('levelSelect');
					if (select.selectedIndex < select.options.length - 1) {
						select.selectedIndex += 1;
						loadSelectedLevel();
					} else {
						select.selectedIndex = 0;
						loadSelectedLevel();
					}
				}

				async function loadLevelFromUrl(url) {
					Module.setStatus('Loading level data...');
					try {
						// Using fetch will automatically route through our P2P wrapper
						const response = await fetch(url);
						if (!response.ok) throw new Error(`Failed to load level: ${response.status}`);
						
						const buffer = await response.arrayBuffer();
						const size = buffer.byteLength;
						const data = Module._malloc(size);
						Module.writeArrayToMemory(new Uint8Array(buffer), data);
						Module.ccall('game_level_load', 'null', ['number', 'number'], [data, size]);
						
						Module.setStatus('');
					} catch (e) {
						Module.setStatus(`Error loading level: ${e.message}`);
						console.error(e);
					}
				}
			</script>
