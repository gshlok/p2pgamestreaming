<!DOCTYPE html>
<html lang="en">
<head>
    <title>OpenLara — Game Asset Streaming Demo</title>
    <link href="favicon.ico" rel="shortcut icon" type="image/x-icon" />
    <meta charset="utf-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="viewport-fit=cover, user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

        html {
            overflow: hidden;
            background-color: #05060c;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 50%, #0d0f1e 0%, #05060c 100%);
            overflow: hidden;
            touch-action: none;
        }

        /* --- Ambient Organic Grain Texture --- */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 99999;
        }

        /* --- Dynamic Cyber Grid Backdrop --- */
        .cyber-grid {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.015) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: center;
            pointer-events: none;
            z-index: 1;
        }

        .cyber-grid::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 30%, transparent 20%, rgba(5,6,12,0.85) 80%);
        }

        /* --- Main Dashboard Panel --- */
        .dashboard-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- Navigation HUD Top bar --- */
        .hud-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 11, 24, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 14px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4),
                        inset 0 1px 1px rgba(255, 255, 255, 0.03);
            transition: border-color 0.3s ease;
        }

        .hud-header:hover {
            border-color: rgba(0, 240, 255, 0.15);
        }

        .hud-branding {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hud-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-logo span {
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0,240,255,0.4);
        }

        .hud-badge {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.8px;
            background: rgba(0, 240, 255, 0.08);
            color: #00f0ff;
            border: 1px solid rgba(0, 240, 255, 0.15);
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        /* --- Live Telemetry Panel in Header --- */
        .hud-telemetry {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .telemetry-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .telemetry-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 8px;
            font-weight: 700;
            color: #4b5563;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .telemetry-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            color: #d1d5db;
        }

        .status-beacon-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-beacon {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #6b7280;
            transition: all 0.3s ease;
        }

        .status-beacon.active {
            background: #00ffaa;
            box-shadow: 0 0 10px #00ffaa, 0 0 20px rgba(0, 255, 170, 0.4);
        }

        .status-beacon.inactive {
            background: #ff8800;
            box-shadow: 0 0 10px #ff8800, 0 0 20px rgba(255, 136, 0, 0.4);
        }

        /* --- Game Console Container --- */
        .console-container {
            position: relative;
            width: 100%;
            aspect-ratio: 854/480;
            background: #020306;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                        inset 0 1px 1px rgba(255, 255, 255, 0.02);
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }

        .console-container:hover {
            border-color: rgba(0, 240, 255, 0.1);
            box-shadow: 0 32px 72px rgba(0, 0, 0, 0.75),
                        0 0 40px rgba(0, 240, 255, 0.05);
        }

        canvas.game {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            outline: none;
        }

        /* --- Futuristic Loading Overlay --- */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 9, 16, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), pointer-events 0.8s ease;
        }

        .loading-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loading-core {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .spinning-ring {
            width: 100%;
            height: 100%;
            transform-origin: center;
            animation: rotate-ring 4s linear infinite;
        }

        @keyframes rotate-ring {
            100% { transform: rotate(360deg); }
        }

        .pulse-logo {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #00f0ff;
            text-shadow: 0 0 12px rgba(0,240,255,0.6);
            animation: logo-pulse 1.5s ease-in-out infinite alternate;
        }

        @keyframes logo-pulse {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
        }

        .loading-term-container {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .loading-progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
        }

        .loading-progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0097a7, #00f0ff);
            box-shadow: 0 0 10px #00f0ff;
            transition: width 0.3s ease;
        }

        .loading-term-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #9ca3af;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            letter-spacing: -0.2px;
        }

        .loading-term-text::before {
            content: "NODE_LOG // ";
            color: #4b5563;
            font-weight: 600;
        }

        /* --- Level Selector Deck (Bottom Card) --- */
        .level-deck {
            width: 100%;
            background: rgba(10, 11, 24, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4),
                        inset 0 1px 1px rgba(255, 255, 255, 0.03);
            transition: border-color 0.3s ease;
        }

        .level-deck:hover {
            border-color: rgba(0, 240, 255, 0.15);
        }

        .deck-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .deck-title-group svg {
            color: #00f0ff;
            filter: drop-shadow(0 0 8px rgba(0,240,255,0.4));
        }

        .deck-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #e5e7eb;
        }

        .deck-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* --- Custom Sci-fi Select --- */
        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '▼';
            font-size: 8px;
            color: #9ca3af;
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        select.deck-select {
            appearance: none;
            -webkit-appearance: none;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f3f4f6;
            padding: 10px 36px 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            min-width: 240px;
            transition: all 0.25s ease;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
        }

        select.deck-select:hover {
            border-color: rgba(0, 240, 255, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }

        select.deck-select:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.15);
        }

        /* --- Premium Cyber Buttons --- */
        .btn-cyber {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            border-radius: 10px;
            padding: 10px 18px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            outline: none;
        }

        .btn-engage {
            background: linear-gradient(135deg, #0097a7, #00f0ff);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #0a0b18;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.25);
        }

        .btn-engage:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 6px 22px rgba(0, 240, 255, 0.4),
                        0 0 15px rgba(0, 240, 255, 0.15);
            background: linear-gradient(135deg, #00acc1, #00f5ff);
        }

        .btn-engage:active {
            transform: translateY(0.5px);
        }

        .btn-next {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #d1d5db;
        }

        .btn-next:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-icon-only {
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #9ca3af;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            transform: scale(1.05);
        }

        .btn-purge {
            color: #ff5500;
        }

        .btn-purge:hover {
            background: rgba(255, 85, 0, 0.08);
            border-color: rgba(255, 85, 0, 0.2);
            color: #ff6622;
        }

        /* --- Compatibility styles & Hide native status initially --- */
        #status {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 11, 24, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 10px rgba(0,240,255,0.1);
            border-radius: 8px;
            padding: 8px 16px;
            color: #00f0ff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            z-index: 50;
            transition: opacity 0.3s ease;
            pointer-events: none;
            opacity: 0;
            display: none;
        }

        /* --- Mode-specific theming --- */
        .mode-cloud .hud-badge { background: rgba(255,107,53,0.1); color: #ff6b35; border-color: rgba(255,107,53,0.2); }
        .mode-cloud .hud-logo span { color: #ff6b35; text-shadow: 0 0 10px rgba(255,107,53,0.4); }
        .mode-cloud .btn-engage { background: linear-gradient(135deg, #cc5522, #ff6b35); border-color: rgba(255,107,53,0.3); box-shadow: 0 4px 15px rgba(255,107,53,0.25); }
        .mode-cloud .btn-engage:hover { background: linear-gradient(135deg, #dd6633, #ff7744); box-shadow: 0 6px 22px rgba(255,107,53,0.4); }
        .mode-cloud .loading-progress-fill { background: linear-gradient(90deg, #cc5522, #ff6b35); box-shadow: 0 0 10px #ff6b35; }
        .mode-cloud .pulse-logo { color: #ff6b35; text-shadow: 0 0 12px rgba(255,107,53,0.6); }

        .btn-mode-toggle {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            color: #d1d5db;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .btn-mode-toggle:hover { transform: translateY(-1px); }
        .mode-p2p .btn-mode-toggle { border-color: rgba(255,107,53,0.2); color: #ff6b35; }
        .mode-p2p .btn-mode-toggle:hover { background: rgba(255,107,53,0.08); border-color: rgba(255,107,53,0.35); }
        .mode-cloud .btn-mode-toggle { border-color: rgba(0,240,255,0.2); color: #00f0ff; }
        .mode-cloud .btn-mode-toggle:hover { background: rgba(0,240,255,0.08); border-color: rgba(0,240,255,0.35); }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>

    <div class="dashboard-container">
        
        <!-- Navbar HUD -->
        <header class="hud-header">
            <div class="hud-branding">
                <div class="hud-logo" id="hud-logo">LARA<span>//</span>SWARM</div>
                <div class="hud-badge" id="hud-mode-badge">🔗 P2P Swarm v1.4</div>
                <button class="btn-mode-toggle" id="btn-mode-toggle" title="Switch streaming mode">☁️ Switch to Cloud</button>
            </div>
            <div class="hud-telemetry">
                <div class="telemetry-item">
                    <span class="telemetry-label">Status</span>
                    <div class="status-beacon-container">
                        <div class="status-beacon inactive" id="hud-conn-dot"></div>
                        <span class="telemetry-value" id="hud-conn-label" style="color:#ff8800;">STANDALONE</span>
                    </div>
                </div>
                <div class="telemetry-item">
                    <span class="telemetry-label">Peers</span>
                    <span class="telemetry-value" id="hud-peer-val">0 nodes</span>
                </div>
                <div class="telemetry-item">
                    <span class="telemetry-label">Saved Bandwidth</span>
                    <span class="telemetry-value" id="hud-saved-val" style="color:#00ffaa;">0 B</span>
                </div>
                <div style="display:flex; gap:6px;">
                    <!-- Purge asset cache -->
                    <button class="btn-icon-only btn-action btn-purge" id="purgeCacheBtn" title="Purge Local Cache" onclick="purgeAssetCache()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                    </button>
                    <!-- Go Fullscreen -->
                    <button class="btn-icon-only btn-action" id="goFS" title="Fullscreen Console">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Game Deck Console Frame -->
        <main class="console-container" id="console-frame">
            <!-- WebGL Loading Overlay -->
            <div class="loading-overlay" id="loading-overlay">
                <div class="loading-core">
                    <!-- High tech spinning SVG dial -->
                    <svg class="spinning-ring" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="44" stroke="rgba(0,240,255,0.06)" stroke-width="3" fill="none" />
                        <circle cx="50" cy="50" r="44" stroke="#00f0ff" stroke-width="3.5" fill="none" stroke-dasharray="100 180" stroke-linecap="round" />
                        <circle cx="50" cy="50" r="34" stroke="rgba(0,255,170,0.04)" stroke-width="2" fill="none" />
                        <circle cx="50" cy="50" r="34" stroke="#00ffaa" stroke-width="2" fill="none" stroke-dasharray="50 150" stroke-linecap="round" style="animation: rotate-ring 2.5s linear infinite reverse;" />
                    </svg>
                    <div class="pulse-logo">LARA</div>
                </div>
                <div class="loading-term-container">
                    <div class="loading-progress-bar">
                        <div class="loading-progress-fill" id="loading-progress-fill"></div>
                    </div>
                    <div class="loading-term-text" id="loading-term-text">System booting...</div>
                </div>
            </div>

            <!-- WebGL Canvas -->
            <canvas class="game" id="canvas" width="854" height="480" oncontextmenu="event.preventDefault()"></canvas>
        </main>

        <!-- Level Selector Cartridge Deck -->
        <footer class="level-deck">
            <div class="deck-title-group">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg>
                <span class="deck-title">Cartridge Sector</span>
            </div>
            <div class="deck-controls">
                <div class="select-wrapper">
                    <select id="levelSelect" class="deck-select">
                        <option value="Tomb-Raider-1/01-Caves.PHD">01 - Caves</option>
                        <option value="Tomb-Raider-1/02-City-of-Vilcabamba.PHD">02 - City of Vilcabamba</option>
                        <option value="Tomb-Raider-1/03-The-Lost-Valley.PHD">03 - The Lost Valley</option>
                        <option value="Tomb-Raider-1/04-Tomb-of-Qualopec.PHD">04 - Tomb of Qualopec</option>
                        <option value="Tomb-Raider-1/05-St-Francis-Folly.PHD">05 - St Francis Folly</option>
                        <option value="Tomb-Raider-1/06-Colosseum.PHD">06 - Colosseum</option>
                        <option value="Tomb-Raider-1/07-Palace-Midas.PHD">07 - Palace Midas</option>
                        <option value="Tomb-Raider-1/08-Cistern.PHD">08 - Cistern</option>
                        <option value="Tomb-Raider-1/09-Tomb-of-Tihocan.PHD">09 - Tomb of Tihocan</option>
                        <option value="Tomb-Raider-1/10-City-of-Khamoon.PHD">10 - City of Khamoon</option>
                        <option value="Tomb-Raider-1/11-Obelisk-of-Khamoon.PHD">11 - Obelisk of Khamoon</option>
                        <option value="Tomb-Raider-1/12-Sanctuary-of-the-Scion.PHD">12 - Sanctuary of the Scion</option>
                        <option value="Tomb-Raider-1/13-Natlas-Mines.PHD">13 - Natlas Mines</option>
                        <option value="Tomb-Raider-1/14-Atlantis.PHD">14 - Atlantis</option>
                        <option value="Tomb-Raider-1/15-The-Great-Pyramid.PHD">15 - The Great Pyramid</option>
                    </select>
                </div>
                <button class="btn-cyber btn-engage" onclick="loadSelectedLevel()">Engage ROM ⚡</button>
                <button class="btn-cyber btn-next" onclick="jumpNextLevel()">Next sector ⏭</button>
            </div>
        </footer>

    </div>

    <!-- Hidden compatibility status label -->
    <div id="status" style="display:none; pointer-events:none; position:absolute; opacity:0;">Starting...</div>

    <script>
        indexedDB.deleteDatabase('OpenLara');

        // --- Mode Detection & UI theming ---
        (function applyMode() {
            var params = new URLSearchParams(window.location.search);
            var mode = params.get('mode') || 'p2p';
            document.body.classList.add('mode-' + mode);

            var logo = document.getElementById('hud-logo');
            var badge = document.getElementById('hud-mode-badge');
            var toggle = document.getElementById('btn-mode-toggle');

            if (mode === 'cloud') {
                if (logo) logo.innerHTML = 'LARA<span>//</span>CLOUD';
                if (badge) badge.textContent = '☁️ Cloud Streaming';
                if (toggle) toggle.innerHTML = '🔗 Switch to P2P';
            } else {
                if (logo) logo.innerHTML = 'LARA<span>//</span>SWARM';
                if (badge) badge.textContent = '🔗 P2P Swarm v1.4';
                if (toggle) toggle.innerHTML = '☁️ Switch to Cloud';
            }

            if (toggle) {
                toggle.addEventListener('click', function() {
                    var newMode = mode === 'p2p' ? 'cloud' : 'p2p';
                    window.location.href = window.location.pathname + '?mode=' + newMode;
                });
            }
        })();

        var statusElement = document.getElementById('status');
        var canvasElement = document.getElementById('canvas');
        var proc;

        function fullscreen(container) {
            Module.ccall('change_fs_mode', 'null', [], []);
            canvasElement.focus();
        }

        var goFS = document.getElementById("goFS");
        goFS.addEventListener("click", function() { fullscreen(canvasElement); }, false);

        window.onload = function() { window.focus(); }
        
        var Module = {
            TOTAL_MEMORY: 192*1024*1024,
            preRun: [],
            postRun: [],
            engineBooted: false,
            print: (function() {
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                };
            })(),
            printErr: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
            },
            canvas: (function() {
                canvasElement.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);
                return canvasElement;
            })(),
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.text) return;
                Module.setStatus.text = text;
                
                // Compatibility link
                if (statusElement) {
                    statusElement.innerHTML = text;
                    if (text && Module.engineBooted && text !== 'All downloads complete.') {
                        statusElement.style.display = 'block';
                        // Force reflow
                        void statusElement.offsetWidth;
                        statusElement.style.opacity = '1';
                    } else if (Module.engineBooted) {
                        statusElement.style.opacity = '0';
                        setTimeout(() => { if (statusElement.style.opacity === '0') statusElement.style.display = 'none'; }, 300);
                    }
                }

                // Technical Loader text integration
                const termText = document.getElementById('loading-term-text');
                if (termText) {
                    termText.textContent = text ? text : 'Boot completed successfully.';
                }

                // Loader progress line calculations
                const progressFill = document.getElementById('loading-progress-fill');
                if (progressFill) {
                    if (text.includes('Preparing...')) {
                        const match = text.match(/\((\d+)\/(\d+)\)/);
                        if (match) {
                            const current = parseInt(match[1]);
                            const total = parseInt(match[2]);
                            const percent = Math.round((current / total) * 100);
                            progressFill.style.width = percent + '%';
                        }
                    } else if (text.includes('Downloading...')) {
                        progressFill.style.width = '30%';
                    } else if (!text || text === 'All downloads complete.' || text.includes('success')) {
                        progressFill.style.width = '100%';
                    }
                }

                // Hide loading overlay smoothly once engine loads
                if (!text || text === 'All downloads complete.') {
                    const overlay = document.getElementById('loading-overlay');
                    if (overlay && !overlay.classList.contains('fade-out')) {
                        setTimeout(() => {
                            overlay.classList.add('fade-out');
                            Module.engineBooted = true;
                            if (canvasElement) canvasElement.focus();
                        }, 600);
                    }
                } else if (!Module.engineBooted) {
                    const overlay = document.getElementById('loading-overlay');
                    if (overlay && overlay.classList.contains('fade-out')) {
                        overlay.classList.remove('fade-out');
                    }
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            },
        };

        var audioContext = null;

        function snd_init() {
            var AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            var count  = 4096;
            var rate   = 44100 / audioContext.sampleRate;
            var framesCount = Math.ceil(count * rate);
            var frames = Module._malloc(framesCount * 4); // interleaved short L, R
            proc = audioContext.createScriptProcessor(count, 2, 2);
            proc.onaudioprocess = function(e) {
                var L = e.outputBuffer.getChannelData(0),
                    R = e.outputBuffer.getChannelData(1);
                Module.ccall('snd_fill', 'null', ['number', 'number'], [frames, framesCount]);
                for (var i = 0; i < count; i++) {
                    var index = frames + Math.floor(i * rate) * 4; // 4 is sample frame stride in bytes
                    L[i] = Module.getValue(index    , 'i16') / 0x8000;
                    R[i] = Module.getValue(index + 2, 'i16') / 0x8000;
                }
            }
            proc.connect(audioContext.destination);
        }

        function getLanguage() {
            var lang = navigator.languages && navigator.languages[0] || navigator.language || navigator.userLanguage;
            if (!lang) return;
            var id = 0;
            lang = lang.substring(0, 2);
            if (lang == "fr") {
                id = 1;
            } else if (lang == "de") {
                id = 2;
            } else if (lang == "es") {
                id = 3;
            } else if (lang == "it") {
                id = 4;
            } else if (lang == "pl") {
                id = 5;
            } else if (lang == "pt") {
                id = 6;
            } else if (lang == "ru" || lang == "be" || lang == "uk") {
                id = 7;
            } else if (lang == "ja") {
                id = 8;
            } else if (lang == "gr") {
                id = 9;
            } else if (lang == "fi") {
                id = 10;
            } else if (lang == "cs") {
                id = 11;
            } else if (lang == "zh") {
                id = 12;
            } else if (lang == "hu") {
                id = 13;
            } else if (lang == "sv") {
                id = 14;
            }
            Module.ccall('set_def_lang', 'null', ['number'], [id]);
        }

        // unlock audio context after user interaction
        var userAction = function() {
            if (audioContext && audioContext.state == "suspended") {
                audioContext.resume().then(function() {
                    window.removeEventListener('touchstart', userAction, false);
                    window.removeEventListener('click', userAction, false);
                    console.log("resume playback");
                });
            }
        };
        window.addEventListener('touchstart', userAction, false);
        window.addEventListener('click', userAction, false);

        Module.setStatus('Downloading...');
        window.onerror = function(event) {
            Module.setStatus('Exception thrown, see JavaScript console');
            Module.setStatus = function(text) {
                if (text) Module.printErr('[post-exception status] ' + text);
            };
        };
    </script>

    <!-- P2P Asset Streaming Layer - loaded BEFORE WASM engine -->
    <script src="p2p/AssetCache.js"></script>
    <script src="p2p/P2PManager.js"></script>
    <script src="p2p/P2POverlay.js"></script>
    <script src="p2p/p2p-bootstrap.js"></script>

    <script>
        var script = document.createElement('script');

        if ('WebAssembly' in window) {
            console.log("Start WebAssembly!");
            script.src = "OpenLara_wasm.js";
        } else {
            console.log("Start asm.js!");
            script.src = "OpenLara.js";
            (function() {
                var memoryInitializer = 'OpenLara.js.mem';
                if (typeof Module['locateFile'] === 'function') {
                    memoryInitializer = Module['locateFile'](memoryInitializer);
                } else if (Module['memoryInitializerPrefixURL']) {
                    memoryInitializer = Module['memoryInitializerPrefixURL'] + memoryInitializer;
                }
                var xhr = Module['memoryInitializerRequest'] = new XMLHttpRequest();
                xhr.open('GET', memoryInitializer, true);
                xhr.responseType = 'arraybuffer';
                xhr.send(null);
            })();
        }

        document.body.appendChild(script);

        var isMobile = !!navigator.platform && (/iPad|iPhone|iPod/.test(navigator.platform) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));

        if (isMobile) {
            canvasElement.className = "game_fs";
            const loadingOverlay = document.getElementById('loading-overlay');
            if (loadingOverlay) loadingOverlay.style.display = 'none';
        }

        async function loadSelectedLevel() {
            const select = document.getElementById('levelSelect');
            const levelPath = select.value;
            const btn = document.querySelector('.btn-engage');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'LOADING... ⚡';
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';

            try {
                const response = await fetch(`/levels/${levelPath}`);
                if (!response.ok) throw new Error(`Failed to load level: ${response.status}`);
                
                const buffer = await response.arrayBuffer();
                const size = buffer.byteLength;
                const data = Module._malloc(size);
                Module.writeArrayToMemory(new Uint8Array(buffer), data);
                Module.ccall('game_level_load', 'null', ['number', 'number'], [data, size]);
                
            } catch (e) {
                console.error(e);
                alert(`Error loading level: ${e.message}`);
            } finally {
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
                if (canvasElement) canvasElement.focus();
            }
        }

        function jumpNextLevel() {
            const select = document.getElementById('levelSelect');
            if (select.selectedIndex < select.options.length - 1) {
                select.selectedIndex += 1;
            } else {
                select.selectedIndex = 0;
            }
            loadSelectedLevel();
        }

        /* --- Clear/Purge local IndexedDB cache --- */
        function purgeAssetCache() {
            indexedDB.deleteDatabase('p2p-asset-cache');
            alert('Local Asset Cache purged! Reloading to apply fresh state.');
            location.reload();
        }

        /* --- Static HUD Swarm Telemetry Sync --- */
        setInterval(() => {
            if (window.p2pManager) {
                const isConnected = window.p2pManager.isConnected();
                const peerDot = document.getElementById('hud-conn-dot');
                const peerLabel = document.getElementById('hud-conn-label');
                const peerCountVal = document.getElementById('hud-peer-val');
                const savedVal = document.getElementById('hud-saved-val');

                if (peerDot && peerLabel) {
                    if (isConnected) {
                        peerDot.className = 'status-beacon active';
                        peerLabel.textContent = 'ACTIVE';
                        peerLabel.style.color = '#00ffaa';
                    } else {
                        peerDot.className = 'status-beacon inactive';
                        peerLabel.textContent = 'STANDALONE';
                        peerLabel.style.color = '#ff8800';
                    }
                }

                const metrics = window.p2pManager.getMetrics();
                if (peerCountVal) {
                    peerCountVal.textContent = metrics.peersConnected === 1 
                        ? '1 node' 
                        : metrics.peersConnected + ' nodes';
                }
                if (savedVal) {
                    const bytes = metrics.bytesSaved;
                    let savedText = '0 B';
                    if (bytes > 0) {
                        const units = ['B', 'KB', 'MB', 'GB'];
                        const i = Math.floor(Math.log(bytes) / Math.log(1024));
                        savedText = `${(bytes / Math.pow(1024, i)).toFixed(1)} ${units[i]}`;
                    }
                    savedVal.textContent = savedText;
                }
            }
        }, 1000);
    </script>
