<!DOCTYPE html>
<html lang="en">
<head>
    <title>OpenLara Engine</title>
    <meta charset="utf-8">
    <meta name="viewport" content="viewport-fit=cover, user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="1" style="outline: none;" oncontextmenu="event.preventDefault()"></canvas>

    <script src="../../../../p2p-bootstrap.js"></script>

    <script>
        var canvasElement = document.getElementById('canvas');
        var audioContext = null;

        var Module = {
            TOTAL_MEMORY: 192*1024*1024,
            canvas: canvasElement,
            setStatus: function(text) {
                console.log('Engine Status:', text);
                if (window.parent && window.parent.onEngineStatus) window.parent.onEngineStatus(text);
            },
            print: console.log,
            printErr: console.error,
            monitorRunDependencies: function(left) {
                this.setStatus(left ? 'Loading Assets...' : 'Booting Engine');
            }
        };

        function snd_init() {
            var AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            audioContext = new AudioContext();
            var count = 4096;
            var rate = 44100 / audioContext.sampleRate;
            var framesCount = Math.ceil(count * rate);
            var frames = Module._malloc(framesCount * 4);
            var proc = audioContext.createScriptProcessor(count, 2, 2);
            proc.onaudioprocess = function(e) {
                var L = e.outputBuffer.getChannelData(0), R = e.outputBuffer.getChannelData(1);
                Module._snd_fill(frames, framesCount);
                for (var i = 0; i < count; i++) {
                    var index = frames + Math.floor(i * rate) * 4;
                    L[i] = Module.getValue(index, 'i16') / 0x8000;
                    R[i] = Module.getValue(index + 2, 'i16') / 0x8000;
                }
            };
            proc.connect(audioContext.destination);
        }

        window.addEventListener('click', () => {
            if (audioContext && audioContext.state === 'suspended') audioContext.resume();
            
            // Request Pointer Lock and Focus
            canvasElement.focus();
            if (canvasElement.requestPointerLock) {
                canvasElement.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === canvasElement) {
                canvasElement.classList.add('locked');
            } else {
                canvasElement.classList.remove('locked');
            }
        });

        function getLanguage() {
            var lang = navigator.languages && navigator.languages[0] || navigator.language || navigator.userLanguage;
            if (!lang) return;
            var id = 0;
            lang = lang.substring(0, 2);
            if (lang == "fr") id = 1;
            else if (lang == "de") id = 2;
            else if (lang == "es") id = 3;
            else if (lang == "it") id = 4;
            else if (lang == "pl") id = 5;
            else if (lang == "pt") id = 6;
            else if (lang == "ru" || lang == "be" || lang == "uk") id = 7;
            else if (lang == "ja") id = 8;
            else if (lang == "gr") id = 9;
            else if (lang == "fi") id = 10;
            else if (lang == "cs") id = 11;
            else if (lang == "zh") id = 12;
            else if (lang == "hu") id = 13;
            else if (lang == "sv") id = 14;
            Module._set_def_lang(id);
        }

        var script = document.createElement('script');
        script.src = ('WebAssembly' in window) ? "OpenLara_wasm.js" : "OpenLara.js";
        document.body.appendChild(script);

        function resize() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Communication with parent
        window.addEventListener('message', (e) => {
            if (e.data.type === 'load-level') {
                const levelId = e.data.level;
                console.log('[Engine] Autoloading level:', levelId);
                
                const levelPath = 'level/' + levelId;
                Module.setStatus('Streaming Level Assets...');
                
                fetch(levelPath).then(res => res.arrayBuffer()).then(buffer => {
                    const data = new Uint8Array(buffer);
                    const ptr = Module._malloc(data.length);
                    HEAPU8.set(data, ptr);
                    
                    // Notify engine to start the level
                    Module._game_level_load(ptr, data.length);
                    
                    Module.setStatus('');
                    canvasElement.focus();
                }).catch(err => {
                    console.error('[Engine] Load Error:', err);
                    Module.setStatus('Error loading level');
                });
            }
            if (e.data.type === 'focus-game') {
                canvasElement.focus();
                if (canvasElement.requestPointerLock) {
                    canvasElement.requestPointerLock();
                }
            }
        });
    </script>
</body>
</html>
