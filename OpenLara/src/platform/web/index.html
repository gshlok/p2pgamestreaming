<!DOCTYPE html>
<html lang="en">
<head>
    <title>OpenLara — Game Asset Streaming Demo</title>
    <link href="favicon.ico" rel="shortcut icon" type="image/x-icon" />
    <meta charset="utf-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="viewport-fit=cover, user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    
    <link rel="stylesheet" href="src/ui/styles.css">
    <style>
        /* Engine Canvas - The Hero */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: #000;
        }

        /* Loading Overlay - Premium Style */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #050508;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), visibility 1s;
        }

        #loading-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-ring {
            width: 60px;
            height: 60px;
            border: 2px solid rgba(255,255,255,0.05);
            border-top-color: #F4F4F5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading-term-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #71717A;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <!-- 3D Viewport -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <!-- UI Layer -->
    <div id="ui-root"></div>

    <!-- Loading Screen -->
    <div id="loading-overlay">
        <div class="loader-ring"></div>
        <div id="loading-term-text">Initializing Engine...</div>
    </div>

    <!-- Emscripten / Game Bridge -->
    <script>
        indexedDB.deleteDatabase('OpenLara');

        var statusElement = document.getElementById('loading-term-text');
        var canvasElement = document.getElementById('canvas');
        var audioContext = null;

        var Module = {
            TOTAL_MEMORY: 192*1024*1024,
            canvas: canvasElement,
            setStatus: function(text) {
                if (statusElement) statusElement.textContent = text || 'Ready';
                if (!text || text === 'All downloads complete.') {
                    const overlay = document.getElementById('loading-overlay');
                    if (overlay) overlay.classList.add('fade-out');
                }
            },
            print: (function() {
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    if (window.ui && window.ui.onGameLog) window.ui.onGameLog(text);
                };
            })(),
            printErr: console.error,
            monitorRunDependencies: function(left) {
                this.setStatus(left ? 'Loading Assets...' : 'Booting Engine');
            }
        };

        // Sound init (bridged from old index)
        function snd_init() {
            var AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            audioContext = new AudioContext();
            var count = 4096;
            var rate = 44100 / audioContext.sampleRate;
            var framesCount = Math.ceil(count * rate);
            var frames = Module._malloc(framesCount * 4);
            var proc = audioContext.createScriptProcessor(count, 2, 2);
            proc.onaudioprocess = function(e) {
                var L = e.outputBuffer.getChannelData(0), R = e.outputBuffer.getChannelData(1);
                Module.ccall('snd_fill', 'null', ['number', 'number'], [frames, framesCount]);
                for (var i = 0; i < count; i++) {
                    var index = frames + Math.floor(i * rate) * 4;
                    L[i] = Module.getValue(index, 'i16') / 0x8000;
                    R[i] = Module.getValue(index + 2, 'i16') / 0x8000;
                }
            };
            proc.connect(audioContext.destination);
        }

        // Language detection (requested by engine)
        function getLanguage() {
            var lang = navigator.languages && navigator.languages[0] || navigator.language || navigator.userLanguage;
            if (!lang) return;
            var id = 0;
            lang = lang.substring(0, 2);
            if (lang == "fr") id = 1;
            else if (lang == "de") id = 2;
            else if (lang == "es") id = 3;
            else if (lang == "it") id = 4;
            else if (lang == "pl") id = 5;
            else if (lang == "pt") id = 6;
            else if (lang == "ru" || lang == "be" || lang == "uk") id = 7;
            else if (lang == "ja") id = 8;
            else if (lang == "gr") id = 9;
            else if (lang == "fi") id = 10;
            else if (lang == "cs") id = 11;
            else if (lang == "zh") id = 12;
            else if (lang == "hu") id = 13;
            else if (lang == "sv") id = 14;
            Module.ccall('set_def_lang', 'null', ['number'], [id]);
        }

        window.addEventListener('click', () => {
            if (audioContext && audioContext.state === 'suspended') audioContext.resume();
        }, { once: true });
    </script>

    <!-- P2P Core -->
    <script src="p2p/AssetCache.js"></script>
    <script src="p2p/P2PManager.js"></script>
    <script src="p2p/p2p-bootstrap.js"></script>

    <!-- Premium UI Layer -->
    <script type="module">
        import { StreamingUI } from './src/ui/index.js';
        
        window.addEventListener('load', () => {
            // Wait for p2pManager to be initialized by bootstrap
            const checkP2P = setInterval(() => {
                if (window.p2pManager) {
                    clearInterval(checkP2P);
                    window.ui = new StreamingUI(window.p2pManager);
                    window.ui.setLevel('TOMB RAIDER I');
                }
            }, 100);
        });
    </script>

    <!-- WASM Bootloader -->
    <script>
        var script = document.createElement('script');
        script.src = ('WebAssembly' in window) ? "OpenLara_wasm.js" : "OpenLara.js";
        document.body.appendChild(script);

        // Resize handler for full screen
        function resize() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();
    </script>

    <!-- Level API -->
    <script>
        async function loadLevel(levelPath) {
            try {
                const response = await fetch(`/levels/${levelPath}`);
                const buffer = await response.arrayBuffer();
                const data = Module._malloc(buffer.byteLength);
                Module.writeArrayToMemory(new Uint8Array(buffer), data);
                Module.ccall('game_level_load', 'null', ['number', 'number'], [data, buffer.byteLength]);
                if (window.ui) window.ui.setLevel(levelPath);
            } catch (e) {
                console.error('Level load failed:', e);
            }
        }
    </script>
</body>
</html>

</body>
</html>
